name: gate

# The gate on Linux and on Windows, as `mise run gate` runs it on a maintainer's machine: the schema, the generated types,
# the lints, the tests, the documentation and the fuzz target's lints (Linux).
on:
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request stops its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The private terms reach only the privacy job, never a job that runs a build script; every other run of the
  # guard says it did not read them rather than failing.
  PRIVACY_TERMS_UNAVAILABLE: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  # The privacy guard over the private terms, in a job of its own: it restores no cache and installs only gitleaks, so
  # no code a dependency wrote runs on this runner before the secret does.
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: aqua:gitleaks/gitleaks
          cache: false
      # A fork's pull request is given no secret, so its guard says it did not read the terms.
      - name: The privacy guard, with the private terms
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
          PRIVACY_TERMS_UNAVAILABLE: ${{ github.event.pull_request.head.repo.fork && '1' || '' }}
          MISE_AUTO_INSTALL: "false"
        run: bash scripts/privacy/run.sh

  # The ruleset requires the gate jobs, so none is green without the guard.
  gate:
    needs: privacy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Every commit, so the schema is compared with the commit that opened its major.
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: mise run gate
