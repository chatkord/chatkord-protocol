# Every tool the gate runs, at one version each, installed by `mise install` (README.md#the-gate).
# The toolchain is rust-toolchain.toml's; mise.lock holds each binary's URL and checksum per platform.
min_version = "2026.10.25"

[settings]
lockfile = true
locked = true

[tools]
"aqua:bufbuild/buf" = "1.75.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.152"
# No release binaries: built from crates.io with its lock.
"cargo:protoc-gen-prost" = "0.5.0"
# Not the gate's: `mise run fuzz` runs it, where libFuzzer is at home.
"cargo:cargo-fuzz" = { version = "0.13.2", os = ["linux"] }
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:lycheeverse/lychee" = "0.24.2"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:evilmartians/lefthook" = "2.2.2"

# The gate's tasks are their own file, so a task's edit leaves the tools' pins alone.
[task_config]
includes = ["scripts/gate/tasks.toml"]
