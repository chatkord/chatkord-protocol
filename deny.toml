# The gate checks bans, licences and sources from the locks (scripts/gate/deny.sh); the advisories, which need the
# network, are each app's audit workflow's, over its lock, which holds every crate these depend on.
[graph]
all-features = false
# The two systems the apps ship to: a dependency only another system builds is not ours to judge.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
# Nothing is ignored globally: an entry is one id, for one crate, with the reason it cannot take the upgrade.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licences only: this crate set is MIT OR Apache-2.0 and both apps, one GPL and one proprietary, take it in.
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
    "Unicode-3.0", "Zlib", "0BSD", "BSL-1.0", "CC0-1.0", "Unlicense",
]
# Allowed for one crate each, by name: a weak or unusual licence is a decision about that crate, not a blanket one.
exceptions = [
    { crate = "libfuzzer-sys", allow = ["NCSA"] },             # LLVM's libFuzzer, in the fuzz target alone, never shipped
]

# Our own crates are checked too, so a manifest that names no licence stops the gate.
[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A wildcard of ours -- a path member of this repo -- has no version to pin, and it is exempt only because
# every member of every workspace here is `publish = false`, which is what makes it a private crate.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
