# The gate (README.md#the-gate): `mise run gate` on demand and before main, `mise run gate:fast` before every commit.
# Each task is one bash script (Git Bash on Windows) under scripts/gate, so the same line runs under sh and cmd.
["gate:fast"]
description = "The git hooks, the privacy guard, formatting, the schema, the generated types, links, the lints, dependencies and the gate's own rules"
depends = ["gate:hooks", "gate:privacy", "gate:fmt", "gate:schema", "gate:codegen", "gate:links", "gate:lints", "gate:deny", "gate:rules"]
run = "echo 'GATE: pass (fast)'"

[gate]
description = "The fast checks, then clippy, the tests and the documentation of the workspace, and the fuzz target's lints"
run = "bash scripts/gate/gate.sh"

[hooks]
description = "Install the git hooks lefthook.yml names"
run = "git config --unset core.hooksPath || true; lefthook install"

# The toolchain and components rust-toolchain.toml names, installed once before the stages that call cargo fan out:
# on a machine without them each stage's first cargo would install them at the same time, and the installs collide.
# With them present it is a check that needs no network.
["gate:toolchain"]
run = "rustup toolchain install --no-self-update"

# The hooks lefthook.yml names are installed and executable, put back by [hooks] when they are not.
["gate:hooks"]
run = "bash scripts/gate/hooks.sh"

["gate:privacy"]
run = "bash scripts/gate/privacy.sh"

["gate:fmt"]
depends = ["gate:toolchain"]
run = "bash scripts/gate/fmt.sh"

["gate:schema"]
run = "bash scripts/gate/schema.sh"

["gate:codegen"]
# After the schema's own checks, so a schema that does not build is reported as that.
depends = ["gate:schema", "gate:toolchain"]
run = "bash scripts/gate/codegen.sh"

["gate:links"]
run = "bash scripts/gate/links.sh"

["gate:lints"]
run = "bash scripts/gate/lints.sh"

# The gate's own rules (what a pass records, which headings a comment may cite) answer their self-tests.
["gate:rules"]
run = "bash scripts/gate/rules.sh"

["gate:deny"]
depends = ["gate:toolchain"]
run = "bash scripts/gate/deny.sh"

# Not a stage: the parser an untrusted peer feeds, fuzzed on Linux.
[fuzz]
description = "Fuzz TARGET (or every target) for SECONDS each, then minimise its corpus"
run = "bash scripts/gate/fuzz.sh"
