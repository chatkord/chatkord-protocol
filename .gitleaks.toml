# The privacy guard's shapes, on gitleaks' own secret rules. Nothing here names a real value: the
# maintainer's own terms are read at run time from the gitignored LAB.local.md (or CI's PRIVACY_TERMS secret) and joined
# to this, with the scanned repository's scripts/privacy/allow.gitleaks.toml, by scripts/privacy/guard.py. A finding
# prints `path:line: rule`, never the text.
title = "Chatkord privacy guard"

[extend]
useDefault = true

# Who owned the machine, not what the machine was: vendor, model, OS and version names are fine; "the laptop" is not.
# "Owner" is a product word (a server's owner, the owner role), so it is flagged only in a lab's context.
[[rules]]
id = "owner-wording"
description = "name the setup by pseudonym (Machine A/B, Account A/B, Server S, the maintainer)"
regex = '''(?i)\b(?:the|this|my|our) laptop\b|\bthis desktop\b|\bthis box\b|\bboth boxes\b|\bthe other box\b|\bowner's (?:machines?|box(?:es)?|laptops?|desktops?|pcs?|computers?|workstations?|gpus?|monitors?|setup|lab|network|nic|router|home|house|hardware|call)\b|\bowner of (?:this|that|the|my|our|his|her|their) (?:machines?|box(?:es)?|laptops?|desktops?|pcs?|computers?|workstations?|gpus?|monitors?|setup|lab|network|nic|router|home|house|hardware|call)\b|\bthe owner (?:ran|runs|measured|tested|saw|sees|heard|hears|clicked|watched|noticed|confirmed|observed|tried|checked|played|reproduced|plugged|unplugged|rebooted)\b|\b(?:the|this|real|live) deployment\b|\blab server\b|\bdev(?:elopment)? (?:machine|box|gpu|server)\b|\bthis dev\b|\bmeasured on this machine\b|\bon this very machine\b'''

[[rules]]
id = "connector"
description = "a monitor is 'Monitor 1/2', never its connector name; a network card is never named"
regex = '''\b(?:e?DP|DisplayPort|HDMI(?:-[A-Z])?|DVI(?:-[A-Z])?|VGA|LVDS|Virtual)-\d+\b|\b(?:enp|eno|ens|wlp|wlo|wls)\d\w*\b'''

[[rules]]
id = "private-ip"
description = "use a TEST-NET address (192.0.2.x, 198.51.100.x, 203.0.113.x)"
regex = '''(?i)\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3})\b|\b(?:fd[0-9a-f]{2}|fe80)(?::[0-9a-f]{0,4}){2,7}\b'''

# Any other address on the internet: only the documentation ranges, loopback and the unspecified address are written.
# A dotted run inside a longer one (a version, an OID) is not an address.
[[rules]]
id = "public-ip"
description = "use a TEST-NET address (192.0.2.x, 198.51.100.x, 203.0.113.x) or 2001:db8::"
regex = '''(?:^|[^.\w])((?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d))(?:[^.\w]|$)|(?i)\b(2[0-9a-f]{3}(?::[0-9a-f]{0,4}){2,7})\b'''
[[rules.allowlists]]
description = "documentation, loopback, unspecified, broadcast and netmask addresses, the private ones private-ip owns, and a run of single digits (a section number, a version)"
regexTarget = "secret"
regexes = [
  '''^(?:192\.0\.2|198\.51\.100|203\.0\.113)\.''',
  '''^(?:127|0|10)\.''',
  '''^255\.''',
  '''^192\.168\.''',
  '''^172\.(?:1[6-9]|2\d|3[01])\.''',
  '''^100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.''',
  '''^169\.254\.''',
  '''(?i)^2001:0?db8:''',
  '''^\d\.\d\.\d\.\d$''',
]

# A private host name is scripts/privacy/guard.py's own rule: in source code it reads only strings and comments.

[[rules]]
id = "personal-path"
description = "use a placeholder path ($SCRATCH, <dir>, /tmp)"
# The secret is the name after the prefix: gitleaks' own allowlist passes a secret that looks like a path.
regex = '''(?i)(?:/mnt/|/home/|/var/home/|/run/media/|/Users/|\b[A-Za-z]:[\\/]+(?:Users|Projects)\b[\\/]*)([\w.-]+)'''
secretGroup = 1

[[rules]]
id = "email"
description = "use an example.invalid address"
regex = '''[\w.+-]+@((?:[\w-]+\.)*[A-Za-z]{3,}[\w-]*)\b'''
secretGroup = 1
[[rules.allowlists]]
description = "reserved domains, and a pin to a full commit (owner/repo@<40 hex>)"
regexTarget = "secret"
regexes = [
  '''(?i)(?:^|\.)(?:invalid|test|example|localhost)$''',
  '''(?i)^example\.(?:com|org|net)$''',
  '''^[0-9a-f]{40}$''',
]
[[rules.allowlists]]
description = "an Inno Setup import (function@library.dll): no mail host ends in .dll"
regexTarget = "secret"
regexes = ['''(?i)\.dll$''']
[[rules.allowlists]]
description = "an image digest (name@sha256:<hex>)"
regexTarget = "line"
regexes = ['''@sha(?:256|512):[0-9a-f]{64}''']
